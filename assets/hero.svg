<svg width="1200" height="384" viewBox="0 0 1200 384" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">Ali Salman. Medical student working in health data science, AI and machine learning, clinical research, evidence synthesis, and open-source research software.</title>
  <desc id="desc">A Vercel-inspired profile card with public research metrics: 29 publications, 124 citations, h-index 6, and i10-index 5.</desc>

  <defs>
    <clipPath id="frame-clip">
      <rect x="1" y="1" width="1198" height="382" rx="12"/>
    </clipPath>

    <filter id="mesh-blur" x="-75%" y="-75%" width="250%" height="250%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="56"/>
    </filter>

    <radialGradient id="develop" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#007CF0" stop-opacity="0.95"/>
      <stop offset="0.56" stop-color="#00DFD8" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#00DFD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="preview" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7928CA" stop-opacity="0.93"/>
      <stop offset="0.58" stop-color="#FF0080" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FF0080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ship" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF4D4D" stop-opacity="0.90"/>
      <stop offset="0.58" stop-color="#F9CB28" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#F9CB28" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="text-fade-light" x1="590" y1="192" x2="1080" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFAFA" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#FAFAFA" stop-opacity="0.96"/>
      <stop offset="0.78" stop-color="#FAFAFA" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FAFAFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="text-fade-dark" x1="590" y1="192" x2="1080" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0A" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#0A0A0A" stop-opacity="0.97"/>
      <stop offset="0.78" stop-color="#0A0A0A" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .canvas { fill: #FAFAFA; }
    .surface { fill: #FFFFFF; }
    .card-shadow { fill: #000000; opacity: 0.04; }
    .frame { fill: none; stroke: #000000; stroke-opacity: 0.08; }
    .hairline { stroke: #EBEBEB; stroke-width: 1; }
    .ink { fill: #171717; }
    .body { fill: #4D4D4D; }
    .muted { fill: #8F8F8F; }
    .blue { fill: #0072F5; }
    .mesh { opacity: 0.48; }
    .fade-light { display: inline; }
    .fade-dark { display: none; }
    .display {
      font-family: Geist, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 64px;
      font-weight: 600;
      letter-spacing: -3.04px;
      font-feature-settings: "liga" 1, "kern" 1;
    }
    .body-text {
      font-family: Geist, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0;
      font-feature-settings: "liga" 1, "kern" 1;
    }
    .label {
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.34px;
      font-feature-settings: "liga" 1;
    }
    .metric-value {
      font-family: Geist, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -1.44px;
      font-feature-settings: "liga" 1, "kern" 1;
    }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0A0A0A; }
      .surface { fill: #111111; }
      .card-shadow { opacity: 0.22; }
      .frame { stroke: #FFFFFF; stroke-opacity: 0.12; }
      .hairline { stroke: #2A2A2A; }
      .ink { fill: #FAFAFA; }
      .body { fill: #B4B4B4; }
      .muted { fill: #8F8F8F; }
      .blue { fill: #52AEFF; }
      .mesh { opacity: 0.68; }
      .fade-light { display: none; }
      .fade-dark { display: inline; }
    }
  </style>

  <g clip-path="url(#frame-clip)">
    <rect x="1" y="1" width="1198" height="382" rx="12" class="canvas"/>

    <g class="mesh" filter="url(#mesh-blur)">
      <ellipse cx="1060" cy="6" rx="286" ry="152" fill="url(#develop)"/>
      <ellipse cx="1008" cy="205" rx="262" ry="174" fill="url(#preview)"/>
      <ellipse cx="1160" cy="382" rx="300" ry="158" fill="url(#ship)"/>
    </g>

    <rect x="560" y="0" width="600" height="384" fill="url(#text-fade-light)" class="fade-light"/>
    <rect x="560" y="0" width="600" height="384" fill="url(#text-fade-dark)" class="fade-dark"/>

    <text x="64" y="134" class="display ink">Ali Salman.</text>
    <text x="64" y="187" class="body-text body">I am a medical student working in health data science, AI and machine learning,</text>
    <text x="64" y="216" class="body-text body">clinical research, and evidence synthesis. I build open-source research software.</text>

    <rect x="752" y="80" width="384" height="232" rx="12" class="card-shadow"/>
    <rect x="752" y="76" width="384" height="232" rx="12" class="surface"/>
    <rect x="752.5" y="76.5" width="383" height="231" rx="11.5" class="frame"/>

    <circle cx="784" cy="108" r="4.5" class="blue"/>
    <text x="796" y="112" class="label ink">RESEARCH METRICS</text>
    <text x="1104" y="112" text-anchor="end" class="label muted">ALL TIME</text>

    <line x1="784" y1="136.5" x2="1104" y2="136.5" class="hairline"/>
    <line x1="944" y1="153" x2="944" y2="291" class="hairline"/>
    <line x1="784" y1="222" x2="1104" y2="222" class="hairline"/>

    <circle cx="784" cy="158" r="4" fill="#0072F5"/>
    <text x="796" y="162" class="label muted">PUBLICATIONS</text>
    <text id="metric-publications" x="784" y="202" class="metric-value ink">29</text>

    <circle cx="976" cy="158" r="4" fill="#45DEC5"/>
    <text x="988" y="162" class="label muted">CITATIONS</text>
    <text id="metric-citations" x="976" y="202" class="metric-value ink">124</text>

    <circle cx="784" cy="244" r="4" fill="#EA3E83"/>
    <text x="796" y="248" class="label muted">H-INDEX</text>
    <text id="metric-h-index" x="784" y="288" class="metric-value ink">6</text>

    <circle cx="976" cy="244" r="4" fill="#FF990A"/>
    <text x="988" y="248" class="label muted">I10-INDEX</text>
    <text id="metric-i10-index" x="976" y="288" class="metric-value ink">5</text>
  </g>

  <rect x="1" y="1" width="1198" height="382" rx="12" class="frame"/>
</svg>

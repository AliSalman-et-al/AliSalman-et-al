<svg width="720" height="620" viewBox="0 0 720 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">Ali Salman — health data science, AI, clinical research, evidence synthesis, and open source.</title>
  <desc id="desc">A mobile Vercel-inspired profile card with aligned typography, a restrained multicolor mesh, and research metrics: 29 publications, 124 citations, h-index 6, and i10-index 5.</desc>

  <defs>
    <clipPath id="frame-clip">
      <rect x="1" y="1" width="718" height="618" rx="16"/>
    </clipPath>

    <filter id="mesh-blur" x="-85%" y="-85%" width="270%" height="270%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="56"/>
    </filter>

    <radialGradient id="develop" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#007CF0" stop-opacity="0.95"/>
      <stop offset="0.56" stop-color="#00DFD8" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#00DFD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="preview" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7928CA" stop-opacity="0.93"/>
      <stop offset="0.58" stop-color="#FF0080" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FF0080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ship" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF4D4D" stop-opacity="0.90"/>
      <stop offset="0.58" stop-color="#F9CB28" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#F9CB28" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fade-light" x1="250" y1="310" x2="700" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFAFA" stop-opacity="1"/>
      <stop offset="0.48" stop-color="#FAFAFA" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#FAFAFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-dark" x1="250" y1="310" x2="700" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0A" stop-opacity="1"/>
      <stop offset="0.48" stop-color="#0A0A0A" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .canvas { fill: #FAFAFA; }
    .surface { fill: #FFFFFF; }
    .card-shadow { fill: #000000; opacity: 0.045; }
    .frame { fill: none; stroke: #000000; stroke-opacity: 0.08; }
    .hairline { stroke: #EBEBEB; stroke-width: 1; }
    .ink { fill: #171717; }
    .body { fill: #4D4D4D; }
    .muted { fill: #8F8F8F; }
    .blue { fill: #0072F5; }
    .mesh { opacity: 0.46; }
    .fade-light { display: inline; }
    .fade-dark { display: none; }
    .display {
      font-family: Geist, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 62px;
      font-weight: 600;
      letter-spacing: -2.94px;
      font-feature-settings: "liga" 1, "kern" 1;
    }
    .body-text {
      font-family: Geist, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0;
      font-feature-settings: "liga" 1, "kern" 1;
    }
    .label {
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.36px;
      font-feature-settings: "liga" 1;
    }
    .metric-value {
      font-family: Geist, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 42px;
      font-weight: 600;
      letter-spacing: -1.62px;
      font-feature-settings: "liga" 1, "kern" 1;
    }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0A0A0A; }
      .surface { fill: #111111; }
      .card-shadow { opacity: 0.24; }
      .frame { stroke: #FFFFFF; stroke-opacity: 0.12; }
      .hairline { stroke: #2A2A2A; }
      .ink { fill: #FAFAFA; }
      .body { fill: #B4B4B4; }
      .muted { fill: #8F8F8F; }
      .blue { fill: #52AEFF; }
      .mesh { opacity: 0.66; }
      .fade-light { display: none; }
      .fade-dark { display: inline; }
    }
  </style>

  <g clip-path="url(#frame-clip)">
    <rect x="1" y="1" width="718" height="618" rx="16" class="canvas"/>

    <g class="mesh" filter="url(#mesh-blur)">
      <ellipse cx="650" cy="6" rx="210" ry="136" fill="url(#develop)"/>
      <ellipse cx="610" cy="286" rx="216" ry="160" fill="url(#preview)"/>
      <ellipse cx="692" cy="618" rx="244" ry="148" fill="url(#ship)"/>
    </g>

    <rect x="220" y="0" width="500" height="620" fill="url(#fade-light)" class="fade-light"/>
    <rect x="220" y="0" width="500" height="620" fill="url(#fade-dark)" class="fade-dark"/>

    <circle cx="42" cy="48" r="5.5" class="blue"/>
    <text x="60" y="53" class="label ink">ALI SALMAN</text>

    <text x="40" y="137" class="display ink">Ali Salman.</text>
    <text x="40" y="188" class="body-text body">Medical student working across health data science,</text>
    <text x="40" y="219" class="body-text body">AI / machine learning, clinical research,</text>
    <text x="40" y="250" class="body-text body">evidence synthesis, and open-source research software.</text>

    <rect x="40" y="296" width="640" height="270" rx="14" class="card-shadow"/>
    <rect x="40" y="292" width="640" height="270" rx="14" class="surface"/>
    <rect x="40.5" y="292.5" width="639" height="269" rx="13.5" class="frame"/>

    <circle cx="76" cy="329" r="5" class="blue"/>
    <text x="92" y="334" class="label ink">RESEARCH PROFILE</text>
    <text x="644" y="334" text-anchor="end" class="label muted">ORCID + SCHOLAR</text>

    <line x1="76" y1="356.5" x2="644" y2="356.5" class="hairline"/>
    <line x1="360" y1="379" x2="360" y2="538" class="hairline"/>
    <line x1="76" y1="456" x2="644" y2="456" class="hairline"/>

    <circle cx="76" cy="392" r="5" fill="#0072F5"/>
    <text x="92" y="397" class="label muted">PUBLICATIONS</text>
    <text id="metric-publications" x="76" y="442" class="metric-value ink">29</text>

    <circle cx="396" cy="392" r="5" fill="#45DEC5"/>
    <text x="412" y="397" class="label muted">CITATIONS</text>
    <text id="metric-citations" x="396" y="442" class="metric-value ink">124</text>

    <circle cx="76" cy="491" r="5" fill="#EA3E83"/>
    <text x="92" y="496" class="label muted">H-INDEX</text>
    <text id="metric-h-index" x="76" y="541" class="metric-value ink">6</text>

    <circle cx="396" cy="491" r="5" fill="#FF990A"/>
    <text x="412" y="496" class="label muted">I10-INDEX</text>
    <text id="metric-i10-index" x="396" y="541" class="metric-value ink">5</text>
  </g>

  <rect x="1" y="1" width="718" height="618" rx="16" class="frame"/>
</svg>

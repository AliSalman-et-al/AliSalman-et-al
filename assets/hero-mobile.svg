<svg width="720" height="556" viewBox="0 0 720 556" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">Ali Salman. Health data science, clinical research, machine learning, AI, and open-source research software.</title>
  <desc id="desc">A mobile Vercel-inspired profile card with public research metrics: 29 publications, 124 citations, h-index 6, and i10-index 5.</desc>

  <defs>
    <clipPath id="frame-clip">
      <rect x="1" y="1" width="718" height="554" rx="14"/>
    </clipPath>

    <filter id="mesh-blur" x="-85%" y="-85%" width="270%" height="270%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="56"/>
    </filter>

    <radialGradient id="develop" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#007CF0" stop-opacity="0.95"/>
      <stop offset="0.56" stop-color="#00DFD8" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#00DFD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="preview" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7928CA" stop-opacity="0.93"/>
      <stop offset="0.58" stop-color="#FF0080" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FF0080" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ship" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF4D4D" stop-opacity="0.90"/>
      <stop offset="0.58" stop-color="#F9CB28" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#F9CB28" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fade-light" x1="250" y1="278" x2="700" y2="278" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFAFA" stop-opacity="1"/>
      <stop offset="0.48" stop-color="#FAFAFA" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#FAFAFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-dark" x1="250" y1="278" x2="700" y2="278" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0A0A" stop-opacity="1"/>
      <stop offset="0.48" stop-color="#0A0A0A" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .canvas { fill: #FAFAFA; }
    .surface { fill: #FFFFFF; }
    .card-shadow { fill: #000000; opacity: 0.04; }
    .frame { fill: none; stroke: #000000; stroke-opacity: 0.08; }
    .hairline { stroke: #EBEBEB; stroke-width: 1; }
    .ink { fill: #171717; }
    .body { fill: #4D4D4D; }
    .muted { fill: #8F8F8F; }
    .blue { fill: #0072F5; }
    .mesh { opacity: 0.46; }
    .fade-light { display: inline; }
    .fade-dark { display: none; }
    .display {
      font-family: Geist, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -2.66px;
      font-feature-settings: "liga" 1, "kern" 1;
    }
    .body-text {
      font-family: Geist, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0;
      font-feature-settings: "liga" 1, "kern" 1;
    }
    .label {
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.36px;
      font-feature-settings: "liga" 1;
    }
    .metric-value {
      font-family: Geist, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -1.52px;
      font-feature-settings: "liga" 1, "kern" 1;
    }

    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0A0A0A; }
      .surface { fill: #111111; }
      .card-shadow { opacity: 0.22; }
      .frame { stroke: #FFFFFF; stroke-opacity: 0.12; }
      .hairline { stroke: #2A2A2A; }
      .ink { fill: #FAFAFA; }
      .body { fill: #B4B4B4; }
      .muted { fill: #8F8F8F; }
      .blue { fill: #52AEFF; }
      .mesh { opacity: 0.66; }
      .fade-light { display: none; }
      .fade-dark { display: inline; }
    }
  </style>

  <g clip-path="url(#frame-clip)">
    <rect x="1" y="1" width="718" height="554" rx="14" class="canvas"/>

    <g class="mesh" filter="url(#mesh-blur)">
      <ellipse cx="650" cy="6" rx="210" ry="136" fill="url(#develop)"/>
      <ellipse cx="610" cy="258" rx="216" ry="160" fill="url(#preview)"/>
      <ellipse cx="692" cy="556" rx="244" ry="148" fill="url(#ship)"/>
    </g>

    <rect x="220" y="0" width="500" height="556" fill="url(#fade-light)" class="fade-light"/>
    <rect x="220" y="0" width="500" height="556" fill="url(#fade-dark)" class="fade-dark"/>

    <text x="40" y="110" class="display ink">Ali Salman.</text>
    <text x="40" y="158" class="body-text body">I work in health data science, clinical research,</text>
    <text x="40" y="187" class="body-text body">machine learning, and AI.</text>
    <text x="40" y="216" class="body-text body">I also build open-source research software.</text>

    <rect x="40" y="244" width="640" height="280" rx="12" class="card-shadow"/>
    <rect x="40" y="240" width="640" height="280" rx="12" class="surface"/>
    <rect x="40.5" y="240.5" width="639" height="279" rx="11.5" class="frame"/>

    <circle cx="72" cy="278" r="5" class="blue"/>
    <text x="88" y="283" class="label ink">RESEARCH METRICS</text>
    <text x="648" y="283" text-anchor="end" class="label muted">ALL TIME</text>

    <line x1="72" y1="304.5" x2="648" y2="304.5" class="hairline"/>
    <line x1="360" y1="326" x2="360" y2="500" class="hairline"/>
    <line x1="72" y1="412" x2="648" y2="412" class="hairline"/>

    <circle cx="72" cy="334" r="5" fill="#0072F5"/>
    <text x="88" y="339" class="label muted">PUBLICATIONS</text>
    <text id="metric-publications" x="72" y="387" class="metric-value ink">29</text>

    <circle cx="392" cy="334" r="5" fill="#45DEC5"/>
    <text x="408" y="339" class="label muted">CITATIONS</text>
    <text id="metric-citations" x="392" y="387" class="metric-value ink">124</text>

    <circle cx="72" cy="442" r="5" fill="#EA3E83"/>
    <text x="88" y="447" class="label muted">H-INDEX</text>
    <text id="metric-h-index" x="72" y="495" class="metric-value ink">6</text>

    <circle cx="392" cy="442" r="5" fill="#FF990A"/>
    <text x="408" y="447" class="label muted">I10-INDEX</text>
    <text id="metric-i10-index" x="392" y="495" class="metric-value ink">5</text>
  </g>

  <rect x="1" y="1" width="718" height="554" rx="14" class="frame"/>
</svg>
